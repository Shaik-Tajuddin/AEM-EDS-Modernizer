<!--
  product-hero-example.html
  =========================
  This file shows the ASSUMED AEM-generated HTML markup that the Universal Editor
  would produce BEFORE the block’s decorate() function in product-hero.js runs.

  In AEM Edge Delivery Services (EDS), content authored in the Universal Editor
  is rendered as a flat list of <div> rows inside a block wrapper. Each field in
  the JSON model (_product-hero.json) produces one row, EXCEPT:
    - "tab" components  — they organise the editor UI but produce NO rows
    - "classes" / "classes_*" fields — applied as CSS classes on the outer div

  The block’s JavaScript then reads these rows by position and rebuilds the DOM.

  DATA: Samsung Galaxy S26 promotional banner.
-->

<div class="product-hero">

  <!-- Row 0: image (reference) -->
  <div>
    <div>
      <picture>
        <source
          type="image/webp"
          srcset="https://www.gradholder.com/img/600x400/581c87/e9d5ff?type=horizontal"
        />
        <img
          src="https://www.gradholder.com/img/600x400/581c87/e9d5ff?type=horizontal"
          alt="Galaxy S26 and S26+ in purple"
          loading="eager"
          width="600"
          height="400"
        />
      </picture>
    </div>
  </div>

  <!-- Row 1: heading (richtext) -->
  <div>
    <div><h1>Galaxy S26 | S26+</h1></div>
  </div>

  <!-- Row 2: subheading (richtext) -->
  <div>
    <div><p>Galaxy AI ✨</p></div>
  </div>

  <!-- Row 3: primaryCtaText (text) -->
  <div>
    <div>Buy</div>
  </div>

  <!-- Row 4: primaryCtaUrl (aem-content) -->
  <div>
    <div><a href="/content/site/en/galaxy-s26/buy">Buy</a></div>
  </div>

  <!-- Row 5: secondaryCtaText (text) -->
  <div>
    <div>Learn more</div>
  </div>

  <!-- Row 6: secondaryCtaUrl (aem-content) -->
  <div>
    <div><a href="/content/site/en/galaxy-s26">Learn more</a></div>
  </div>

</div>

        </div>
      </div>
