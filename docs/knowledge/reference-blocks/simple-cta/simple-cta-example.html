<!--
  simple-cta-example.html
  =======================
  This file shows the ASSUMED AEM-generated HTML markup that the Universal Editor
  would produce BEFORE the block’s decorate() function in simple-cta.js runs.

  In AEM Edge Delivery Services (EDS), content authored in the Universal Editor
  is rendered as a flat list of <div> rows inside a block wrapper. Each field in
  the JSON model (_simple-cta.json) produces one row, EXCEPT:
    - "tab" components  — they organise the editor UI but produce NO rows
    - "classes" / "classes_*" fields — applied as CSS classes on the outer div

  The block’s JavaScript then reads these rows by position and rebuilds the DOM.
-->

<div class="simple-cta cta-primary-filled">

  <!-- Row 0: id (text) -->
  <div>
    <div>newsletter-cta</div>
  </div>

  <!-- Row 1: title (richtext) -->
  <div>
    <div><h3>Stay Updated</h3></div>
  </div>

  <!-- Row 2: text (richtext) -->
  <div>
    <div><p>Subscribe to our newsletter for the latest product updates and exclusive deals.</p></div>
  </div>

  <!-- Row 3: ctaLink (aem-content) -->
  <div>
    <div><a href="/content/site/en/subscribe">Subscribe</a></div>
  </div>

  <!-- Row 4: ctaContent (richtext) -->
  <div>
    <div><p>Sign up now</p></div>
  </div>

</div>

<!--
  AFTER decorate() runs, the block is rebuilt into:

  <div class="simple-cta cta-primary-filled" id="newsletter-cta">
    <div class="simple-cta-inner">
      <div class="simple-cta-title"><h3>Stay Updated</h3></div>
      <div class="simple-cta-text"><p>Subscribe to our newsletter...</p></div>
      <div class="simple-cta-cta">
        <a href="/content/site/en/subscribe" class="brand-cta">Sign up now</a>
      </div>
    </div>
  </div>
-->
